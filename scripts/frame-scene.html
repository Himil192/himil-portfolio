<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #0a0a0b; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/three/three.module.js" } }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";

      const params = new URLSearchParams(location.search);
      const WIDTH = Number(params.get("w") ?? 1920);
      const HEIGHT = Number(params.get("h") ?? 1080);
      const portrait = HEIGHT > WIDTH;

      const OBSIDIAN = new THREE.Color("#0a0a0b");

      const NOISE = /* glsl */ `
        vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
        vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
        vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
        vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}
        float snoise(vec3 v){
          const vec2 C=vec2(1./6.,1./3.);
          const vec4 D=vec4(0.,.5,1.,2.);
          vec3 i=floor(v+dot(v,C.yyy));
          vec3 x0=v-i+dot(i,C.xxx);
          vec3 g=step(x0.yzx,x0.xyz);
          vec3 l=1.-g;
          vec3 i1=min(g.xyz,l.zxy);
          vec3 i2=max(g.xyz,l.zxy);
          vec3 x1=x0-i1+C.xxx;
          vec3 x2=x0-i2+C.yyy;
          vec3 x3=x0-D.yyy;
          i=mod289(i);
          vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
          float n_=.142857142857;
          vec3 ns=n_*D.wyz-D.xzx;
          vec4 j=p-49.*floor(p*ns.z*ns.z);
          vec4 x_=floor(j*ns.z);
          vec4 y_=floor(j-7.*x_);
          vec4 x=x_*ns.x+ns.yyyy;
          vec4 y=y_*ns.x+ns.yyyy;
          vec4 h=1.-abs(x)-abs(y);
          vec4 b0=vec4(x.xy,y.xy);
          vec4 b1=vec4(x.zw,y.zw);
          vec4 s0=floor(b0)*2.+1.;
          vec4 s1=floor(b1)*2.+1.;
          vec4 sh=-step(h,vec4(0.));
          vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
          vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
          vec3 p0=vec3(a0.xy,h.x);
          vec3 p1=vec3(a0.zw,h.y);
          vec3 p2=vec3(a1.xy,h.z);
          vec3 p3=vec3(a1.zw,h.w);
          vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
          p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
          vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);
          m=m*m;
          return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
        }
      `;

      const scene = new THREE.Scene();
      scene.background = OBSIDIAN;

      const camera = new THREE.PerspectiveCamera(32, WIDTH / HEIGHT, 0.1, 50);
      camera.position.z = portrait ? 9.2 : 6.4;

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(WIDTH, HEIGHT);
      document.body.appendChild(renderer.domElement);

      const group = new THREE.Group();
      // Leaves the left of landscape frames clear for the chapter text.
      group.position.set(portrait ? 0 : 0.95, portrait ? 0.55 : 0, 0);
      // Tall phones crop the sides of portrait frames, so the shapes need margin.
      group.scale.setScalar(portrait ? 0.8 : 1);
      scene.add(group);

      // Seeded so every render of the sequence places particles identically.
      let seed = 1921;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      const rect = (x, y, w, h) => ({ x, y, w, h });
      const outline = (x, y, w, h, t = 0.025) => [
        rect(x, y + h / 2, w, t),
        rect(x, y - h / 2, w, t),
        rect(x - w / 2, y, t, h),
        rect(x + w / 2, y, t, h),
      ];

      // Rows of tokens, indented like source code.
      const code = [];
      [
        [0, 0.5, 0.3, 0.42],
        [1, 0.34, 0.62],
        [2, 0.28, 0.46, 0.2],
        [2, 0.5, 0.34],
        [3, 0.22, 0.6],
        [2, 0.38, 0.3, 0.26],
        [1, 0.16],
        [1, 0.44, 0.52],
        [0, 0.12],
      ].forEach(([indent, ...tokens], row) => {
        let x = -1.22 + indent * 0.24;
        for (const width of tokens) {
          code.push(rect(x + width / 2, 0.96 - row * 0.24, width, 0.075));
          x += width + 0.07;
        }
      });

      // Four cards, each with a title and lines of content.
      const cards = [];
      for (const [x, y] of [
        [-0.64, 0.5],
        [0.64, 0.5],
        [-0.64, -0.5],
        [0.64, -0.5],
      ]) {
        cards.push(
          ...outline(x, y, 1.14, 0.86),
          rect(x - 0.16, y + 0.24, 0.62, 0.09),
          rect(x, y + 0.02, 0.9, 0.04),
          rect(x - 0.1, y - 0.1, 0.7, 0.04),
          rect(x - 0.32, y - 0.26, 0.26, 0.08),
        );
      }

      // A browser window holding a page.
      const browser = [
        ...outline(0, 0, 2.6, 2.1, 0.03),
        rect(0, 0.76, 2.6, 0.02),
        rect(-1.16, 0.91, 0.07, 0.07),
        rect(-1.04, 0.91, 0.07, 0.07),
        rect(-0.92, 0.91, 0.07, 0.07),
        rect(0.2, 0.91, 1.3, 0.06),
        rect(-0.6, 0.48, 1.0, 0.16),
        rect(-0.72, 0.24, 0.76, 0.05),
        rect(-0.92, 0.04, 0.36, 0.11),
        ...outline(0.72, 0.32, 0.86, 0.68),
        ...outline(-0.84, -0.6, 0.68, 0.56),
        ...outline(0, -0.6, 0.68, 0.56),
        ...outline(0.84, -0.6, 0.68, 0.56),
      ];

      const monogram = [rect(-0.62, 0, 0.3, 2.3), rect(0.62, 0, 0.3, 2.3), rect(0, 0, 0.96, 0.28)];

      const COUNT = 70000;
      const place = (rects, depth) => {
        const total = rects.reduce((sum, r) => sum + r.w * r.h, 0);
        const points = new Float32Array(COUNT * 3);
        for (let i = 0; i < COUNT; i++) {
          let pick = rand() * total;
          const r = rects.find((candidate) => (pick -= candidate.w * candidate.h) <= 0) ?? rects[0];
          points.set(
            [r.x + (rand() - 0.5) * r.w, r.y + (rand() - 0.5) * r.h, (rand() - 0.5) * depth],
            i * 3,
          );
        }
        return new THREE.BufferAttribute(points, 3);
      };

      const seeds = new Float32Array(COUNT);
      for (let i = 0; i < COUNT; i++) seeds[i] = rand();

      const dust = new THREE.BufferGeometry();
      dust.setAttribute("position", place(code, 0.05));
      dust.setAttribute("aCards", place(cards, 0.05));
      dust.setAttribute("aBrowser", place(browser, 0.05));
      dust.setAttribute("aMonogram", place(monogram, 0.22));
      dust.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 1));

      const dustUniforms = {
        uStep: { value: 0 },
        uDrift: { value: 0 },
        uTime: { value: 0 },
        uSize: { value: (HEIGHT / 1080) * (portrait ? 3.4 : 3.2) },
      };
      const points = new THREE.Points(
        dust,
        new THREE.ShaderMaterial({
          uniforms: dustUniforms,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexShader: /* glsl */ `
            ${NOISE}
            attribute vec3 aCards;
            attribute vec3 aBrowser;
            attribute vec3 aMonogram;
            attribute float aSeed;
            uniform float uStep;
            uniform float uDrift;
            uniform float uTime;
            uniform float uSize;
            varying float vSeed;
            void main(){
              float stage=min(floor(uStep),2.);
              vec3 from=stage<.5?position:stage<1.5?aCards:aBrowser;
              vec3 to=stage<.5?aCards:stage<1.5?aBrowser:aMonogram;
              float t=smoothstep(aSeed*.45,aSeed*.45+.55,uStep-stage);
              vec3 p=mix(from,to,t);
              vec3 wander=vec3(
                snoise(position*2.+vec3(uTime)),
                snoise(position*2.+vec3(4.,uTime,1.)),
                snoise(position*2.+vec3(9.,2.,uTime)));
              p+=wander*(sin(t*3.14159)*.42+uDrift*.012);
              vec4 mv=modelViewMatrix*vec4(p,1.);
              gl_PointSize=uSize*(6.4/-mv.z)*(.55+aSeed*.7);
              vSeed=aSeed;
              gl_Position=projectionMatrix*mv;
            }
          `,
          fragmentShader: /* glsl */ `
            varying float vSeed;
            void main(){
              float a=smoothstep(.5,.1,length(gl_PointCoord-.5));
              vec3 col=mix(vec3(.85,.66,.34),vec3(.96,.9,.78),vSeed*vSeed);
              gl_FragColor=vec4(col,a*.42);
            }
          `,
        }),
      );
      group.add(points);

      const smooth = (a, b, x) => {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      };

      window.renderFrame = (progress) => {
        // Each change happens in the gap between two chapters' text.
        dustUniforms.uStep.value =
          smooth(0.17, 0.3, progress) + smooth(0.45, 0.58, progress) + smooth(0.71, 0.86, progress);
        dustUniforms.uTime.value = progress * 2.4;
        const settle = 1 - smooth(0.82, 0.95, progress);
        dustUniforms.uDrift.value = settle;
        // Settles to face the camera so the monogram reads on the last frame.
        group.rotation.set(0.05 * settle * Math.sin(progress * 5), 0.2 * settle * Math.sin(progress * 6.4), 0);

        renderer.render(scene, camera);
        return renderer.domElement.toDataURL("image/png");
      };
      window.sceneReady = true;
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #0a0a0b; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/three/three.module.js" } }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";

      const params = new URLSearchParams(location.search);
      const WIDTH = Number(params.get("w") ?? 1920);
      const HEIGHT = Number(params.get("h") ?? 1080);
      const portrait = HEIGHT > WIDTH;

      const OBSIDIAN = new THREE.Color("#0a0a0b");

      const NOISE = /* glsl */ `
        vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
        vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
        vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
        vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}
        float snoise(vec3 v){
          const vec2 C=vec2(1./6.,1./3.);
          const vec4 D=vec4(0.,.5,1.,2.);
          vec3 i=floor(v+dot(v,C.yyy));
          vec3 x0=v-i+dot(i,C.xxx);
          vec3 g=step(x0.yzx,x0.xyz);
          vec3 l=1.-g;
          vec3 i1=min(g.xyz,l.zxy);
          vec3 i2=max(g.xyz,l.zxy);
          vec3 x1=x0-i1+C.xxx;
          vec3 x2=x0-i2+C.yyy;
          vec3 x3=x0-D.yyy;
          i=mod289(i);
          vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
          float n_=.142857142857;
          vec3 ns=n_*D.wyz-D.xzx;
          vec4 j=p-49.*floor(p*ns.z*ns.z);
          vec4 x_=floor(j*ns.z);
          vec4 y_=floor(j-7.*x_);
          vec4 x=x_*ns.x+ns.yyyy;
          vec4 y=y_*ns.x+ns.yyyy;
          vec4 h=1.-abs(x)-abs(y);
          vec4 b0=vec4(x.xy,y.xy);
          vec4 b1=vec4(x.zw,y.zw);
          vec4 s0=floor(b0)*2.+1.;
          vec4 s1=floor(b1)*2.+1.;
          vec4 sh=-step(h,vec4(0.));
          vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
          vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
          vec3 p0=vec3(a0.xy,h.x);
          vec3 p1=vec3(a0.zw,h.y);
          vec3 p2=vec3(a1.xy,h.z);
          vec3 p3=vec3(a1.zw,h.w);
          vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
          p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
          vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);
          m=m*m;
          return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
        }
      `;

      const SHAPE = /* glsl */ `
        uniform float uMelt;
        uniform float uTime;
        vec3 liquid(vec3 d){
          float n=snoise(d*1.05+vec3(0.,uTime,uTime*.6))*.34+snoise(d*2.1-vec3(uTime*.8))*.05;
          return d*(1.+n);
        }
        vec3 monolith(vec3 d){
          vec3 s=vec3(.62,1.3,.62);
          vec3 a=abs(d)/s;
          float k=pow(pow(a.x,8.)+pow(a.y,8.)+pow(a.z,8.),1./8.);
          return d/k;
        }
        vec3 shape(vec3 d){return mix(monolith(d),liquid(d),uMelt);}
      `;

      const scene = new THREE.Scene();
      scene.background = OBSIDIAN;

      const camera = new THREE.PerspectiveCamera(32, WIDTH / HEIGHT, 0.1, 50);
      camera.position.z = portrait ? 9.2 : 6.4;

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(WIDTH, HEIGHT);
      document.body.appendChild(renderer.domElement);

      const group = new THREE.Group();
      // Leaves the left of landscape frames clear for the chapter text.
      group.position.set(portrait ? 0 : 0.95, portrait ? 0.55 : 0, 0);
      scene.add(group);

      const uniforms = {
        uMelt: { value: 0 },
        uTime: { value: 0 },
        uGold: { value: 0 },
        uDissolve: { value: 0 },
      };

      const form = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1, 110),
        new THREE.ShaderMaterial({
          uniforms,
          vertexShader: /* glsl */ `
            ${NOISE}
            ${SHAPE}
            varying vec3 vNormal;
            varying vec3 vView;
            varying vec3 vDir;
            void main(){
              vec3 d=normalize(position);
              vec3 p=shape(d);
              vec3 a=normalize(cross(d,vec3(.13,1.,.21)));
              vec3 b=cross(d,a);
              float e=.012;
              vec3 pa=shape(normalize(d+a*e));
              vec3 pb=shape(normalize(d+b*e));
              vec3 n=normalize(cross(pa-p,pb-p));
              if(dot(n,p)<0.)n=-n;
              vec4 mv=modelViewMatrix*vec4(p,1.);
              vNormal=normalize(normalMatrix*n);
              vView=normalize(-mv.xyz);
              vDir=d;
              gl_Position=projectionMatrix*mv;
            }
          `,
          fragmentShader: /* glsl */ `
            ${NOISE}
            uniform float uGold;
            uniform float uDissolve;
            varying vec3 vNormal;
            varying vec3 vView;
            varying vec3 vDir;
            vec3 env(vec3 r){
              vec3 c=mix(vec3(.006),vec3(.1,.085,.065),smoothstep(-1.,1.,r.y));
              c+=vec3(1.,.93,.82)*3.2*smoothstep(.78,.97,dot(r,normalize(vec3(.55,.62,.56))));
              c+=vec3(.9,.8,.65)*.9*smoothstep(.86,.98,dot(r,normalize(vec3(-.8,.1,.5))));
              c+=vec3(.8,.72,.6)*.55*pow(.5+.5*sin(r.y*8.+r.x*3.),10.);
              return c;
            }
            void main(){
              float cut=snoise(vDir*2.6)*.5+.5;
              float edge=uDissolve*1.15-.08;
              if(cut<edge)discard;
              vec3 n=normalize(vNormal);
              vec3 v=normalize(vView);
              vec3 r=reflect(-v,n);
              float f=pow(1.-max(dot(n,v),0.),4.);
              vec3 e=env(r);
              vec3 champagne=vec3(.88,.64,.3);
              vec3 obsidian=e*vec3(.14)+champagne*f*1.5;
              vec3 metal=e*champagne*1.7+vec3(.5,.33,.12)*.1+champagne*f*.9;
              vec3 col=mix(obsidian,metal,uGold);
              col+=champagne*4.*smoothstep(.06,0.,cut-edge)*step(.001,uDissolve);
              col=col/(1.+col*.72);
              gl_FragColor=vec4(pow(col,vec3(1./2.2)),1.);
            }
          `,
        }),
      );
      group.add(form);

      // Seeded so every render of the sequence places particles identically.
      let seed = 1921;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      const COUNT = 70000;
      const directions = new Float32Array(COUNT * 3);
      const targets = new Float32Array(COUNT * 3);
      const seeds = new Float32Array(COUNT);
      const bars = [
        { x: -0.62, w: 0.3, y: 0, h: 2.3 },
        { x: 0.62, w: 0.3, y: 0, h: 2.3 },
        { x: 0, w: 0.96, y: 0, h: 0.28 },
      ];
      for (let i = 0; i < COUNT; i++) {
        const z = rand() * 2 - 1;
        const angle = rand() * Math.PI * 2;
        const radius = Math.sqrt(1 - z * z);
        directions.set([radius * Math.cos(angle), radius * Math.sin(angle), z], i * 3);
        const bar = bars[i % 10 < 4 ? 0 : i % 10 < 8 ? 1 : 2];
        targets.set(
          [
            bar.x + (rand() - 0.5) * bar.w,
            bar.y + (rand() - 0.5) * bar.h,
            (rand() - 0.5) * 0.22,
          ],
          i * 3,
        );
        seeds[i] = rand();
      }

      const dust = new THREE.BufferGeometry();
      dust.setAttribute("position", new THREE.BufferAttribute(directions, 3));
      dust.setAttribute("aTarget", new THREE.BufferAttribute(targets, 3));
      dust.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 1));

      const dustUniforms = {
        uMelt: uniforms.uMelt,
        uTime: uniforms.uTime,
        uForm: { value: 0 },
        uShow: { value: 0 },
        uSize: { value: (HEIGHT / 1080) * (portrait ? 3.4 : 3.2) },
      };
      const points = new THREE.Points(
        dust,
        new THREE.ShaderMaterial({
          uniforms: dustUniforms,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexShader: /* glsl */ `
            ${NOISE}
            ${SHAPE}
            attribute vec3 aTarget;
            attribute float aSeed;
            uniform float uForm;
            uniform float uSize;
            varying float vSeed;
            void main(){
              float t=smoothstep(aSeed*.45,aSeed*.45+.55,uForm);
              vec3 from=liquid(normalize(position));
              vec3 p=mix(from,aTarget,t);
              float swirl=sin(t*3.14159);
              p+=swirl*.5*vec3(
                snoise(position*2.+vec3(uTime)),
                snoise(position*2.+vec3(4.,uTime,1.)),
                snoise(position*2.+vec3(9.,2.,uTime)));
              vec4 mv=modelViewMatrix*vec4(p,1.);
              gl_PointSize=uSize*(6.4/-mv.z)*(.55+aSeed*.7);
              vSeed=aSeed;
              gl_Position=projectionMatrix*mv;
            }
          `,
          fragmentShader: /* glsl */ `
            uniform float uShow;
            varying float vSeed;
            void main(){
              float a=smoothstep(.5,.1,length(gl_PointCoord-.5));
              vec3 col=mix(vec3(.85,.66,.34),vec3(.96,.9,.78),vSeed*vSeed);
              gl_FragColor=vec4(col,a*uShow*.42);
            }
          `,
        }),
      );
      group.add(points);

      const smooth = (a, b, x) => {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      };

      window.renderFrame = (progress) => {
        uniforms.uTime.value = progress * 2.4;
        uniforms.uMelt.value = smooth(0.18, 0.46, progress);
        uniforms.uGold.value = smooth(0.2, 0.5, progress);
        uniforms.uDissolve.value = smooth(0.6, 0.8, progress);
        dustUniforms.uForm.value = smooth(0.64, 0.95, progress);
        dustUniforms.uShow.value = smooth(0.6, 0.7, progress);

        form.visible = uniforms.uDissolve.value < 1;
        form.rotation.set(0.14 * Math.sin(progress * 6), progress * 4.2 + 0.5, 0);
        // Settles to face the camera so the monogram reads on the last frame.
        points.rotation.y = (1 - smooth(0.64, 1, progress)) * 2.4;

        renderer.render(scene, camera);
        return renderer.domElement.toDataURL("image/png");
      };
      window.sceneReady = true;
    </script>
  </body>
</html>
